server {
  listen 80 default_server;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  # DNS embutido do Docker — re-resolve `api` em runtime. Sem isso o nginx
  # cacheia o IP do boot e devolve 502 quando o container `api` é recriado
  # (ganha novo IP na rede). O upstream via variável força a re-resolução.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    set $bagre_api http://api:3001;
    proxy_pass $bagre_api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 50m;
  }

  location /metrics {
    set $bagre_api_metrics http://api:3001;
    proxy_pass $bagre_api_metrics/metrics;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
